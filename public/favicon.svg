<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5s ease-in-out infinite;
    }
    .eye.right { animation-delay: 0.12s; }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye { animation: none; }
    }
  </style>

  <!-- ears -->
  <path d="M16 22 L20 4 L28 24 Z" fill="#7d828c" stroke="#4a4d55" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M48 22 L44 4 L36 24 Z" fill="#7d828c" stroke="#4a4d55" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- head -->
  <path d="M18 24 L46 24 L50 34 L32 58 L14 34 Z" fill="#7d828c" stroke="#4a4d55" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- muzzle -->
  <path d="M32 33 L41 42 L32 55 L23 42 Z" fill="#eceef0"/>

  <!-- eyes -->
  <ellipse class="eye left" cx="24" cy="34" rx="3.2" ry="2.6" fill="#e0a458"/>
  <ellipse class="eye right" cx="40" cy="34" rx="3.2" ry="2.6" fill="#e0a458"/>

  <!-- nose -->
  <path d="M32 48 L28.5 52.5 L35.5 52.5 Z" fill="#26262b"/>
</svg>
