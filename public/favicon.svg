<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .steam {
      fill: none;
      stroke: #cdd6e0;
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0;
      transform-origin: center;
      animation: rise 2.4s ease-in-out infinite;
    }
    .steam.s2 { animation-delay: 0.5s; }
    .steam.s3 { animation-delay: 1s; }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0) scaleY(0.85); }
      25%  { opacity: 0.9; }
      70%  { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(-9px) scaleY(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .steam { animation: none; opacity: 0.6; }
    }
  </style>

  <!-- steam -->
  <path class="steam s1" d="M24 20c-3 3-3 5 0 8s3 5 0 8" />
  <path class="steam s2" d="M32 17c-3 3-3 5 0 8s3 5 0 8" />
  <path class="steam s3" d="M40 20c-3 3-3 5 0 8s3 5 0 8" />

  <!-- momo body -->
  <ellipse cx="32" cy="43" rx="21" ry="13.5" fill="#F2DCB6" stroke="#C99C5C" stroke-width="2"/>

  <!-- veg flecks -->
  <ellipse cx="25" cy="45" rx="2" ry="1.1" fill="#6FA85A" transform="rotate(-20 25 45)"/>
  <ellipse cx="38" cy="47" rx="2" ry="1.1" fill="#6FA85A" transform="rotate(15 38 47)"/>
  <ellipse cx="32" cy="41" rx="1.6" ry="0.9" fill="#E2725B" transform="rotate(5 32 41)"/>

  <!-- pleated crown -->
  <circle cx="14" cy="34" r="5.5" fill="#F2DCB6" stroke="#C99C5C" stroke-width="2"/>
  <circle cx="22" cy="29" r="5.5" fill="#F2DCB6" stroke="#C99C5C" stroke-width="2"/>
  <circle cx="32" cy="27" r="5.5" fill="#F2DCB6" stroke="#C99C5C" stroke-width="2"/>
  <circle cx="42" cy="29" r="5.5" fill="#F2DCB6" stroke="#C99C5C" stroke-width="2"/>
  <circle cx="50" cy="34" r="5.5" fill="#F2DCB6" stroke="#C99C5C" stroke-width="2"/>

  <!-- top twist -->
  <circle cx="32" cy="22" r="3" fill="#F2DCB6" stroke="#C99C5C" stroke-width="2"/>
</svg>
